<main class="auth-page">
  <section class="auth-card">
    <div class="icon">&#9679;</div>
    <h1>Create account!</h1>
    <p class="subtitle">It only takes a moment</p>

    @if (error()) {
      <p class="form-error">{{ error() }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field" [class.invalid]="showError('username')">
        <label for="username">Username</label>
        <input id="username" type="text" formControlName="username" autocomplete="username" />
        @if (showError('username')) {
          <div class="error">Username is required.</div>
        }
      </div>

      <div class="field" [class.invalid]="showError('email')">
        <label for="email">E-mail</label>
        <input id="email" type="email" formControlName="email" autocomplete="email" />
        @if (showError('email')) {
          <div class="error">Enter a valid e-mail.</div>
        }
      </div>

      <div class="field" [class.invalid]="showError('password')">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" autocomplete="new-password" />
        @if (showError('password')) {
          <div class="error">Password must have at least 6 characters.</div>
        }
      </div>

      <button class="btn" type="submit" [disabled]="loading()">
        {{ loading() ? 'Creating...' : 'Create →' }}
      </button>
    </form>

    <p class="switch">Already have an account? <a routerLink="/login">Sign in</a></p>
  </section>
</main>
